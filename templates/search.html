{% extends "base.html" %}

{% block title %}Search Trails - Waypoint{% endblock %}

{% block content %}
<h1>Search Trails</h1>

<form method="GET">
    <label for="q">Search:</label>
    <input type="text" id="q" name="q" value="{{ query }}">
    <button type="submit">Search</button>
</form>

{% if query %}
    <p>You searched for: {{ query }}</p>
{% else %}
    <p>Enter a trail name to search.</p>
{% endif %}
{% endblock %}
